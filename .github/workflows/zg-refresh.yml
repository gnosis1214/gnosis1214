name: Refresh activity card

on:
  schedule:
    - cron: '17 * * * *' # Hourly. It only commits when the numbers change.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/zg-activity.svg assets/zg-activity-mobile.svg README.md
          git diff --cached --quiet || { git commit -m 'Refresh activity card'; git push; }
